name: B002-B4 stencil-cut diagnostic (proof inventory)

on:
  pull_request:
    paths:
      - 'research/wp-import-b4-cut/**'
      - '.github/workflows/b002b4-stencil-cut.yml'

permissions:
  contents: read

jobs:
  stencil:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      WP_IMAGE: framac/frama-c@sha256:4f0b7a2bd600c4daabfdcdfa393a3c18301e0db18f3b2739f1d9650193462d36
      ALT_URL: https://github.com/OCamlPro/alt-ergo/releases/download/v2.6.4/alt-ergo-v2.6.4-x86_64-linux-musl
      ALT_SHA256: 80d41dd9cf4b024be7412e499f81960ddc63978f5d78a29311a05aaab125681a
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source lineage and no new assumptions
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wp-import-b1/check_source.py
          python3 research/wp-import-b2/check_source.py
          python3 research/wp-import-b3/check_source.py
          python3 research/wp-import-b3-split/check_source.py
          python3 research/wp-import-b4/check_source.py
          python3 research/wp-import-b4-cut/check_source.py
      - name: Fetch pinned verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b002b4-cut"
          chmod 777 "$RUNNER_TEMP/b002b4-cut"
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 120 \
            "$ALT_URL" -o "$RUNNER_TEMP/b002b4-cut/alt-ergo"
          printf '%s  %s\n' "$ALT_SHA256" "$RUNNER_TEMP/b002b4-cut/alt-ergo" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/b002b4-cut/alt-ergo"
          docker pull "$WP_IMAGE"
      - name: Check stencil lemma independently and preserve WP outcomes
        shell: bash
        run: |
          set -euo pipefail
          timeout 420s docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/b002b4-cut/alt-ergo:/usr/local/bin/alt-ergo:ro" \
            -v "$RUNNER_TEMP/b002b4-cut:/results" \
            -w /tmp "$WP_IMAGE" bash -ec '
              set -o pipefail
              export PATH="/usr/local/bin:$PATH"
              frama-c -version | tee /results/frama-version.txt
              alt-ergo --version | tee /results/prover-version.txt
              test "$(alt-ergo --version)" = "v2.6.4"
              why3 config detect
              timeout 390s frama-c -machdep x86_64 \
                -wp -wp-model Typed+float -wp-rte \
                -wp-prover qed,alt-ergo -wp-par 1 -wp-timeout 60 \
                -wp-print /source/research/wp-import-b4-cut/probe_b002b4_cut.c \
                2>&1 | tee /results/integration.log
            '
      - name: Diagnostic only, require stencil Valid
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wp-import-b4-cut/check_log.py \
            "$RUNNER_TEMP/b002b4-cut/integration.log" \
            "$RUNNER_TEMP/b002b4-cut/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B002-B4-stencil-cut-evidence
          path: |
            ${{ runner.temp }}/b002b4-cut/*.log
            ${{ runner.temp }}/b002b4-cut/*.txt
            ${{ runner.temp }}/b002b4-cut/*.json
          if-no-files-found: warn
