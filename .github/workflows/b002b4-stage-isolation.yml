name: B002-B4 isolate stage assertion VCs

on:
  pull_request:
    paths:
      - 'research/wp-import-b4-stage/**'
      - '.github/workflows/b002b4-stage-isolation.yml'

permissions:
  contents: read

jobs:
  stage-isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    env:
      WP_IMAGE: framac/frama-c@sha256:4f0b7a2bd600c4daabfdcdfa393a3c18301e0db18f3b2739f1d9650193462d36
      ALT_URL: https://github.com/OCamlPro/alt-ergo/releases/download/v2.6.4/alt-ergo-v2.6.4-x86_64-linux-musl
      ALT_SHA256: 80d41dd9cf4b024be7412e499f81960ddc63978f5d78a29311a05aaab125681a
    steps:
      - uses: actions/checkout@v4
      - name: Check all research source transformations and unchanged candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wp-import-b1/check_source.py
          python3 research/wp-import-b2/check_source.py
          python3 research/wp-import-b3/check_source.py
          python3 research/wp-import-b3-split/check_source.py
          python3 research/wp-import-b4/check_source.py
          python3 research/wp-import-b4-cut/check_source.py
          test ! -e research/wp-import-b4-stage/probe.c
      - name: Verify pinned solver and image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b002b4-stage"
          chmod 777 "$RUNNER_TEMP/b002b4-stage"
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 120 \
            "$ALT_URL" -o "$RUNNER_TEMP/b002b4-stage/alt-ergo"
          printf '%s  %s\n' "$ALT_SHA256" "$RUNNER_TEMP/b002b4-stage/alt-ergo" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/b002b4-stage/alt-ergo"
          docker pull "$WP_IMAGE"
      - name: Isolate stage VCs using unchanged C/ACSL file
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/b002b4-stage/alt-ergo:/usr/local/bin/alt-ergo:ro" \
            -v "$RUNNER_TEMP/b002b4-stage:/results" \
            -w /tmp "$WP_IMAGE" bash \
            /source/research/wp-import-b4-stage/run_isolation.sh
      - name: Audit independent goal outputs; reject missing or failed proof
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wp-import-b4-stage/check_isolation.py "$RUNNER_TEMP/b002b4-stage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B002-B4-stage-isolation-evidence
          path: |
            ${{ runner.temp }}/b002b4-stage/*.log
            ${{ runner.temp }}/b002b4-stage/*.txt
            ${{ runner.temp }}/b002b4-stage/*.json
            ${{ runner.temp }}/b002b4-stage/*.exit
            ${{ runner.temp }}/b002b4-stage/generated-vcs.tgz
          if-no-files-found: warn
